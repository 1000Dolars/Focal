name: Compilar APK

# Etiqueta v*      -> compila y publica un Release con el APK adjunto.
# Ejecucion manual -> compila y deja el APK como artefacto, sin publicar nada.
# Asi el workflow se puede probar sin crear un Release de mentira.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build en EAS
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # OJO: --output solo funciona en builds locales. Para builds de nube hay
      # que pedir --json y descargar la URL del artefacto por separado.
      - name: Compilar en EAS
        id: build
        run: |
          set -euo pipefail
          eas build --platform android --profile preview --non-interactive --wait --json > build.json
          # --json devuelve un array de builds; tomamos el primero. Se usa node
          # (ya disponible) en vez de jq para no depender de otra herramienta.
          url=$(node -e "const b=require('./build.json');const x=Array.isArray(b)?b[0]:b;process.stdout.write((x&&x.artifacts&&x.artifacts.buildUrl)||'')")
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "No se pudo obtener la URL del APK. Salida de EAS:"
            cat build.json
            exit 1
          fi
          echo "Artefacto: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Descargar el APK
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o focal.apk "${{ steps.build.outputs.url }}"
          ls -lh focal.apk

      # Prueba manual: el APK queda descargable desde la pagina del run.
      - name: Guardar como artefacto (ejecucion manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: focal-apk
          path: focal.apk
          retention-days: 7

      # Etiqueta de version: publica el Release con el APK adjunto.
      - name: Publicar el Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: focal.apk
          generate_release_notes: true
          body: |
            ## Focal ${{ github.ref_name }}

            Descarga `focal.apk` aqui abajo y abrelo en tu telefono Android.
            El sistema pedira permitir la instalacion.

            Mas informacion en [focal](https://1000dolars.github.io/Focal/).
